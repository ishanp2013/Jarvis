<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jarvis Orb</title>
<style>
  html, body { margin: 0; height: 100%; background: #090603; overflow: hidden; user-select: none; }
  body { display: grid; place-items: center; cursor: grab; }
  #wrap { width: 100vmin; height: 100vmin; border-radius: 50%;
          background: radial-gradient(circle, #1a1106 0%, #0b0703 62%, #090603 100%); position: relative; }
  #orb { width: 100%; height: 100%; display: block; }
  #tag { position: absolute; left: 0; right: 0; bottom: 14%; text-align: center; font: 600 10px/1 "Segoe UI", sans-serif;
         letter-spacing: .2em; color: #ffcf7a; opacity: .75; text-transform: uppercase; pointer-events: none; }
  body.game #wrap { opacity: .35; }
</style>
</head>
<body title="Click: talk · Double-click: open Jarvis · Right-click: stop">
<div id="wrap"><canvas id="orb" width="300" height="300"></canvas><div id="tag"></div></div>
<!--bridge-->
<script src="orb.js"></script>
<script src="overlay.js"></script>
</body>
</html>
